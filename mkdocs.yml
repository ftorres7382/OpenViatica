# NOTE: This will be running in project root
site_name: OpenViatica Documentation
docs_dir: ./
theme:
  name: material
  palette:
    scheme: slate
plugins:
  - search
  - same-dir
  - drawio:
      toolbar: true      # Shows the zoom/fullscreen toolbar on hover
      viewer_js: "https://viewer.diagrams.net/js/viewer-static.min.js"
      darkmode: true
      edit: false
  - exclude:
      glob:
        - ".venv/*"
        - ".vscode/*"
        - "OpenViatica.egg-info/*"